name: Build and Publish Docker Image

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '10 14 */3 * 2'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}${{ github.event.pull_request.number && '-' }}${{ github.event.pull_request.number || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && true || false }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.event.pull_request.base.repo.name || github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      CONTAINER_NAME: test-${{ github.run_id }}

    steps:
      - name: Checkout Dockerfile
        uses: actions/checkout@v6

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ github.ref_name == 'master' }}

      - name: Build main Docker image
        id: prebuild
        uses: docker/build-push-action@v7
        with:
          build-args: &build-args GH_TOKEN=${{ github.token }}
          context: &context .
          file: &file ./Dockerfile
          cache-to: &cache-to ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,ignore-error=true' || '' }}
          cache-from: &cache-from ${{ github.event_name != 'pull_request' && 'type=gha' || '' }}
          push: false
          load: true
          tags: &tags ${{ steps.meta.outputs.tags }}
          labels: &labels ${{ steps.meta.outputs.labels }}

      - name: test - start
        run: |
          sudo docker run -t -d \
          --name ${{ env.CONTAINER_NAME }} \
            -p 21:21 -p 40000-40100:40000-40100 \
            -e FTP_LIST="testuser:testuser" \
            -e PASSIVE_MIN_PORT="40000" \
            -e PASSIVE_MAX_PORT="40100" \
          $(echo "${{ steps.meta.outputs.tags }}" | head -n1)
      - name: test - check logs
        uses: crazy-max/.github/.github/actions/container-logs-check@main
        with:
          name: ${{ env.CONTAINER_NAME }}
          log_check: " ProFTPD "
          timeout: 120
      - name: test - specific tests
        env:
          FTP_USER: testuser
          FTP_PASS: testuser
        run: |
          RANDOM_FOLDER1=$(tr -dc 'A-Za-z0-9' </dev/urandom 2>/dev/null | head -c 8)
          RANDOM_FOLDER2=$(tr -dc 'A-Za-z0-9' </dev/urandom 2>/dev/null | head -c 8)
          RANDOM_FOLDER3=$(tr -dc 'A-Za-z0-9' </dev/urandom 2>/dev/null | head -c 8)
          ftp -v -n -p <<EOT
          open localhost 21
          user ${{ env.FTP_USER }} ${{ env.FTP_PASS }}
          bin
          mkdir testdir
          ls
          cd testdir
          mkdir $RANDOM_FOLDER1
          mkdir $RANDOM_FOLDER2
          mkdir $RANDOM_FOLDER3
          ls
          rmdir $RANDOM_FOLDER3
          ls
          quit
          EOT
          docker exec -t ${{ env.CONTAINER_NAME }} sh -c "ls -r /home/testuser/testdir | grep $RANDOM_FOLDER1 > /dev/null || exit 1"
      - name: test - show logs
        if: always()
        run: |
          sudo docker logs ${{ env.CONTAINER_NAME }} || true
      - name: test - stop and remove
        if: always()
        run: |
          sudo docker stop -t 10 ${{ env.CONTAINER_NAME }} || sudo docker stop -s SIGKILL -t 10 ${{ env.CONTAINER_NAME }} || true
          sudo docker rm -f ${{ env.CONTAINER_NAME }}

      - name: Build and push main Docker image
        id: build
        uses: docker/build-push-action@v7
        with: 
          build-args: *build-args
          context: *context
          file: *file
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          cache-to: *cache-to
          cache-from: *cache-from
          push: ${{ github.event_name != 'pull_request' }}
          tags: *tags
          labels: *labels
